[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-pipeline"
version = "0.1.0"
description = "Dagster + dbt + DuckDB + MLflow pipeline for SEC EDGAR data"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]
orchestration = ["dagster", "dbt-duckdb", "duckdb", "mlflow"]

[tool.setuptools.packages.find]
where = ["src"]
